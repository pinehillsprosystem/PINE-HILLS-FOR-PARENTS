<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pine Hills Children Academy - Official Feed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            background-color: #0d0d12;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            position: relative;
            overflow: hidden; 
            background-color: #000;
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
        }

        /* --- HEADER NAVBAR --- */
        .header-wrapper {
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%;
            padding: 16px;
            z-index: 100; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .school-title-wrap {
            display: flex;
            flex-direction: column;
        }
        .school-name {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.3px;
        }
        .school-tagline {
            font-size: 10px;
            color: #ffd700;
            font-weight: 600;
        }

        .top-tab-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 15px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
        }
        .top-tab.active { color: #ffffff; }
        .top-tab.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background-color: #ffd700;
            border-radius: 2px;
        }

        .header-icon-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; }

        /* --- SEARCH OVERLAY --- */
        .search-overlay-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f1015;
            z-index: 1050;
            display: none; 
            flex-direction: column;
            padding: 16px;
        }
        .search-header-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .search-input-wrapper {
            flex: 1;
            position: relative;
        }
        .search-page-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #1c1d24;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .search-icon-inside {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: #8a8a8a;
            stroke-width: 2.5;
            fill: none;
        }
        .close-search-btn {
            background: none;
            border: none;
            color: #ffd700;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .search-results-grid {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        
        .grid-video-tile {
            background: #1a1b22;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 9 / 15;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .grid-video-tile video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .grid-tile-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px 8px 8px 8px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }
        .grid-tile-user {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        /* --- FEED CONTAINERS --- */
        #dynamicFeed {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.35s cubic-bezier(0.15, 0.85, 0.35, 1.2);
        }

        .video-post { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            overflow: hidden;
        }
        
        video { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            z-index: 1;
        }

        .play-overlay-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            width: 70px;
            height: 70px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            pointer-events: none;
            opacity: 1;
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .play-overlay-btn svg { width: 32px; height: 32px; fill: #fff; margin-left: 4px; }
        .video-post.is-playing .play-overlay-btn { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }

        .double-tap-heart {
            position: absolute;
            z-index: 20;
            width: 80px;
            height: 80px;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            animation: heartPop 0.8s ease-out forwards;
        }
        .double-tap-heart svg { width: 100%; height: 100%; fill: #fe2c55; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); }

        @keyframes heartPop {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.3) rotate(0deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.6) rotate(15deg); opacity: 0; }
        }

        /* --- SIDEBAR ACTIONS --- */
        .action-sidebar { 
            position: absolute; 
            right: 14px; 
            bottom: 75px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 20px; 
            z-index: 20; 
        }

        .profile-avatar-box {
            position: relative;
            width: 48px;
            height: 48px;
        }
        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #ffd700;
            background: #1e1e24;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #ffd700;
            font-size: 18px;
        }
        .avatar-plus-btn {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 18px;
            background: #fe2c55;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 12px;
            font-weight: 900;
        }

        .action-btn { 
            background: none; 
            border: none; 
            color: white; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-size: 11px; 
            font-weight: 600; 
        }
        .action-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .action-btn:active .action-icon { transform: scale(1.15); }
        .action-icon svg { width: 22px; height: 22px; fill: #ffffff; }
        .action-btn.liked .action-icon svg { fill: #fe2c55; }
        .action-btn span {
            margin-top: 4px;
            font-size: 11px;
            color: #ffffff;
            font-weight: 600;
        }

        .music-disk {
            width: 42px;
            height: 42px;
            background: radial-gradient(circle, #2b2b2b 25%, #111 26%, #111 100%);
            border: 6px solid #181818;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: rotateDisk 3.5s linear infinite;
            animation-play-state: paused;
        }
        .video-post.is-playing .music-disk { animation-play-state: running; }
        .music-disk::after { content: ''; width: 8px; height: 8px; background: #ffd700; border-radius: 50%; }

        @keyframes rotateDisk {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- CONTENT OVERLAY --- */
        .video-info-overlay { 
            position: absolute; 
            left: 0; 
            bottom: 60px;
            width: 100%;
            padding: 30px 90px 20px 16px; 
            z-index: 15; 
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            pointer-events: none;
        }
        .user-block {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            pointer-events: auto;
        }
        .username { 
            font-size: 15px; 
            font-weight: 700; 
            color: #fff;
        }
        .verified-badge { width: 16px; height: 16px; fill: #20d5ec; }
        .description { 
            font-size: 13.5px; 
            line-height: 1.4; 
            color: #f1f1f1;
            pointer-events: auto;
            margin-bottom: 10px;
        }
        
        .music-track-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #ffd700;
            pointer-events: auto;
        }
        .music-track-bar svg { width: 14px; height: 14px; fill: #ffd700; }
        .track-ticker {
            width: 150px;
            overflow: hidden;
            white-space: nowrap;
        }
        .track-ticker span {
            display: inline-block;
            animation: ticker 8s linear infinite;
        }
        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* --- NAVIGATION BOTTOM --- */
        .bottom-nav-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background: rgba(13, 13, 18, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 6px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: #8a8a9e;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        .nav-item.active { color: #ffd700; }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
        
        .create-btn-wrapper {
            position: relative;
            width: 44px;
            height: 28px;
            background: #fff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .create-btn-wrapper::before {
            content: '';
            position: absolute;
            left: -3px;
            top: 0;
            width: 12px;
            height: 100%;
            background: #ffd700;
            border-radius: 8px 0 0 8px;
            z-index: -1;
        }
        .create-btn-wrapper::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 0;
            width: 12px;
            height: 100%;
            background: #fe2c55;
            border-radius: 0 8px 8px 0;
            z-index: -1;
        }
        .create-btn-wrapper svg { width: 16px; height: 16px; fill: #000; }

        .no-data { text-align: center; padding-top: 50%; color: #888; font-size: 15px; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="app-container" id="appContainer">
        
        <div class="header-wrapper">
            <div class="header-brand">
                <img src="real logo copy.jpg" alt="Logo" class="header-logo-img">
                <div class="school-title-wrap">
                    <span class="school-name">PINE HILLS</span>
                    <span class="school-tagline">Children Academy</span>
                </div>
            </div>

            <div class="top-tab-wrapper">
                <span class="top-tab active">Campus Feed</span>
            </div>

            <button class="header-icon-btn" onclick="openSearchSystem()">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
        </div>

        <div class="search-overlay-page" id="searchOverlayPage">
            <div class="search-header-bar">
                <div class="search-input-wrapper">
                    <svg class="search-icon-inside" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchPageInput" class="search-page-input" placeholder="Search campus videos & events..." onkeyup="performGridSearch()">
                </div>
                <button class="close-search-btn" onclick="closeSearchSystem()">Cancel</button>
            </div>
            <div class="search-results-grid" id="searchResultsGrid"></div>
        </div>

        <div id="dynamicFeed">
            <div class="no-data">Loading Campus Feed...</div>
        </div>

        <div class="bottom-nav-bar">
            <div class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Home</span>
            </div>
            <div class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6l9-4.91V17h2V9L12 3z M5 13.18v4L12 21l7-3.82v-4L12 17L5 13.18z"/></svg>
                <span>Campus</span>
            </div>
            <div class="create-btn-wrapper">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </div>
            <div class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                <span>Notice</span>
            </div>
            <div class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>Profile</span>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDATM3pz-eauXtxt6t3V_shp-WBhuTuovI",
            authDomain: "pine-hills-school.firebaseapp.com",
            databaseURL: "https://pine-hills-school-default-rtdb.firebaseio.com",
            projectId: "pine-hills-school",
            storageBucket: "pine-hills-school.firebasestorage.app",
            messagingSenderId: "310029732655",
            appId: "1:310029732655:web:37edd331495239524cefda"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        const container = document.getElementById('appContainer');
        const feed = document.getElementById('dynamicFeed');
        
        let isUserInteracted = false;
        let localVideosData = []; 
        let currentFeedIndex = 0;
        let totalFeedCount = 0;
        let lastClickTime = 0;

        function updateVideoPlayback() {
            const posts = document.querySelectorAll('.video-post');
            posts.forEach((post, index) => {
                const video = post.querySelector('video');
                if (!video) return;

                if (index === currentFeedIndex) {
                    if (!isUserInteracted && index === 0) {
                        video.pause();
                        post.classList.remove('is-playing');
                    } else {
                        video.muted = false;
                        video.play().then(() => {
                            post.classList.add('is-playing');
                        }).catch(() => {
                            video.muted = true;
                            video.play();
                        });
                    }
                } else {
                    video.pause();
                    video.currentTime = 0;
                    post.classList.remove('is-playing');
                }
            });
        }

        database.ref('videos').orderByChild('timestamp').on('value', (snapshot) => {
            const data = snapshot.val();
            feed.innerHTML = '';
            localVideosData = []; 

            if(!data) {
                feed.innerHTML = '<div class="no-data">No content available.</div>';
                totalFeedCount = 0;
                return;
            }

            const videoEntries = Object.entries(data).reverse(); 

            videoEntries.forEach(([id, videoData], index) => {
                localVideosData.push({
                    domIndex: index,
                    username: videoData.username || '@pinehillsschool',
                    description: videoData.description || '',
                    videoUrl: videoData.videoUrl
                });

                let totalCommentsCount = videoData.realComments ? Object.keys(videoData.realComments).length : (videoData.comments || 0);
                let firstLetter = (videoData.username || 'P').replace('@','').charAt(0);

                const postBlock = document.createElement('div');
                postBlock.className = 'video-post';
                postBlock.style.height = container.clientHeight + 'px';
                postBlock.setAttribute('data-index', index);

                postBlock.innerHTML = `
                    <video loop muted playsinline src="${videoData.videoUrl}"></video>
                    
                    <div class="play-overlay-btn">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>

                    <div class="action-sidebar">
                        <div class="profile-avatar-box">
                            <div class="avatar-img">${firstLetter}</div>
                            <div class="avatar-plus-btn">+</div>
                        </div>

                        <button class="action-btn" onclick="toggleLike(this)">
                            <div class="action-icon">
                                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            </div>
                            <span>${videoData.likes || '0'}</span>
                        </button>
                        
                        <button class="action-btn">
                            <div class="action-icon">
                                <svg viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18zM18 14H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
                            </div>
                            <span>${totalCommentsCount}</span>
                        </button>

                        <button class="action-btn" onclick="triggerWebsiteShare('${videoData.username}')">
                            <div class="action-icon">
                                <svg viewBox="0 0 24 24"><path d="M10 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
                            </div>
                            <span>Share</span>
                        </button>

                        <div class="music-disk"></div>
                    </div>

                    <div class="video-info-overlay">
                        <div class="user-block">
                            <span class="username">${videoData.username || '@pinehillsschool'}</span>
                            <svg class="verified-badge" viewBox="0 0 512 512"><path d="M256 0C114.6 0 0 114.6 0 256s114.6 256 256 256s256-114.6 256-256S397.4 0 256 0zM375 201L239 337c-4.7 4.7-11 7-17 7s-12.3-2.3-17-7l-69-69c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l52.1 52.1L341.1 167c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 34z"/></svg>
                        </div>
                        <div class="description">${videoData.description || ''}</div>
                        <div class="music-track-bar">
                            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                            <div class="track-ticker">
                                <span>Official Audio - Pine Hills Children Academy • Official Campus Feed</span>
                            </div>
                        </div>
                    </div>
                `;
                feed.appendChild(postBlock);
            });
            
            totalFeedCount = videoEntries.length;
            currentFeedIndex = 0;
            feed.style.transform = `translateY(0px)`;
            isUserInteracted = false;
            updateVideoPlayback();
        });

        window.addEventListener('resize', () => {
            const containerHeight = container.clientHeight;
            document.querySelectorAll('.video-post').forEach(post => {
                post.style.height = containerHeight + 'px';
            });
            feed.style.transform = `translateY(-${currentFeedIndex * containerHeight}px)`;
        });

        function triggerWebsiteShare(username) {
            const currentWebsiteUrl = window.location.href; 
            const messageText = encodeURIComponent(`🎓 Check out this update on Pine Hills Portal:\n\n👉 ${currentWebsiteUrl}`);
            window.open(`https://api.whatsapp.com/send?text=${messageText}`, '_blank');
        }

        function openSearchSystem() {
            document.querySelectorAll('video').forEach(v => v.pause());
            document.getElementById('searchOverlayPage').style.display = 'flex';
            const input = document.getElementById('searchPageInput');
            input.value = '';
            input.focus();
        }

        function closeSearchSystem() {
            document.getElementById('searchOverlayPage').style.display = 'none';
            updateVideoPlayback();
        }

        function performGridSearch() {
            const query = document.getElementById('searchPageInput').value.toLowerCase().trim();
            const gridContainer = document.getElementById('searchResultsGrid');
            gridContainer.innerHTML = '';

            if (query === "") return;

            const filtered = localVideosData.filter(item => 
                item.username.toLowerCase().includes(query) || 
                item.description.toLowerCase().includes(query)
            );

            filtered.forEach(item => {
                const tile = document.createElement('div');
                tile.className = 'grid-video-tile';
                tile.onclick = () => scrollToSelectedVideo(item.domIndex);
                tile.innerHTML = `
                    <video src="${item.videoUrl}" muted playsinline></video>
                    <div class="grid-tile-overlay">
                        <div class="grid-tile-user">${item.username}</div>
                    </div>
                `;
                gridContainer.appendChild(tile);
            });
        }

        function scrollToSelectedVideo(targetIndex) {
            document.getElementById('searchOverlayPage').style.display = 'none';
            if (targetIndex >= 0 && targetIndex < totalFeedCount) {
                isUserInteracted = true;
                currentFeedIndex = targetIndex;
                feed.style.transform = `translateY(-${currentFeedIndex * container.clientHeight}px)`;
                setTimeout(updateVideoPlayback, 100);
            }
        }

        function toggleLike(btn) {
            btn.classList.toggle('liked');
        }

        container.addEventListener('click', (e) => {
            if(e.target.closest('.action-sidebar') || e.target.closest('.header-wrapper') || e.target.closest('.bottom-nav-bar') || e.target.closest('.search-overlay-page')) return;
            
            const now = Date.now();
            const posts = document.querySelectorAll('.video-post');
            const currentPost = posts[currentFeedIndex];

            if (now - lastClickTime < 300) {
                createDoubleTapHeart(e.clientX, e.clientY, currentPost);
                const likeBtn = currentPost.querySelector('.action-btn');
                if(likeBtn && !likeBtn.classList.contains('liked')) {
                    toggleLike(likeBtn);
                }
            } else {
                setTimeout(() => {
                    if (Date.now() - lastClickTime >= 300 && currentPost) {
                        const video = currentPost.querySelector('video');
                        if(video) {
                            isUserInteracted = true;
                            video.muted = false;
                            if(video.paused) {
                                video.play();
                                currentPost.classList.add('is-playing');
                            } else {
                                video.pause();
                                currentPost.classList.remove('is-playing');
                            }
                        }
                    }
                }, 300);
            }
            lastClickTime = now;
        });

        function createDoubleTapHeart(x, y, parent) {
            const heart = document.createElement('div');
            heart.className = 'double-tap-heart';
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            heart.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
            parent.appendChild(heart);
            setTimeout(() => heart.remove(), 800);
        }

        let isScrollThrottled = false;
        container.addEventListener('wheel', (e) => {
            if (e.target.closest('.search-overlay-page')) return;
            e.preventDefault(); 
            if (isScrollThrottled || totalFeedCount <= 0) return;

            if (Math.abs(e.deltaY) > 20) { 
                let previousIndex = currentFeedIndex;
                if (e.deltaY > 0) {
                    if (currentFeedIndex < totalFeedCount - 1) currentFeedIndex++;
                } else {
                    if (currentFeedIndex > 0) currentFeedIndex--;
                }

                if (currentFeedIndex !== previousIndex) {
                    isScrollThrottled = true;
                    isUserInteracted = true;
                    feed.style.transform = `translateY(-${currentFeedIndex * container.clientHeight}px)`;
                    updateVideoPlayback();
                    setTimeout(() => { isScrollThrottled = false; }, 500); 
                }
            }
        }, { passive: false });

        let touchStartY = 0;
        container.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        container.addEventListener('touchend', (e) => {
            if (e.target.closest('.search-overlay-page')) return;
            let touchEndY = e.changedTouches[0].clientY;
            let diffY = touchStartY - touchEndY;

            if (Math.abs(diffY) > 50) {
                let previousIndex = currentFeedIndex;
                if (diffY > 0) {
                    if (currentFeedIndex < totalFeedCount - 1) currentFeedIndex++;
                } else {
                    if (currentFeedIndex > 0) currentFeedIndex--;
                }

                if (currentFeedIndex !== previousIndex) {
                    isUserInteracted = true;
                    feed.style.transform = `translateY(-${currentFeedIndex * container.clientHeight}px)`;
                    updateVideoPlayback();
                }
            }
        }, { passive: true });
    </script>
</body>
</html>
