<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pine Hills Children Academy - Official Campus Portal</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        html, body {
            background-color: #000000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            position: relative;
            overflow: hidden; 
            background-color: #000;
        }

        /* --- MODERN LOW-END OPTIMIZED HEADER NAVBAR --- */
        .header-wrapper {
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%;
            padding: 14px 16px 8px 16px;
            z-index: 100; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            transform: translateZ(0);
        }

        .header-top-row, .filter-pills-bar {
            pointer-events: auto;
        }

        .header-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo-img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #ffd700;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .school-title-wrap {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .school-name {
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            line-height: 1.1;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .school-tagline {
            font-size: 9px;
            color: #ffd700;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admission-btn {
            background: #ffd700;
            color: #000000;
            font-size: 10px;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.3);
        }

        .header-icon-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #ffffff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-icon-btn svg { 
            width: 16px; 
            height: 16px; 
            fill: none; 
            stroke: #ffffff; 
            stroke-width: 2.5; 
        }

        /* Category Filters Bar */
        .filter-pills-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 4px;
        }

        .filter-pills-bar::-webkit-scrollbar { 
            display: none; 
        }

        .pill {
            background: rgba(255, 255, 255, 0.18);
            color: rgba(255, 255, 255, 0.9);
            padding: 5px 14px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .pill.active {
            background: #ffffff;
            color: #000000;
            font-weight: 800;
        }

        /* --- SEARCH OVERLAY --- */
        .search-overlay-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f1015;
            z-index: 1050;
            display: none; 
            flex-direction: column;
            padding: 16px;
        }
        .search-header-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .search-input-wrapper {
            flex: 1;
            position: relative;
        }
        .search-page-input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1c1d24;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .search-icon-inside {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            stroke: #8a8a8a;
            stroke-width: 2.5;
            fill: none;
        }
        .close-search-btn {
            background: none;
            border: none;
            color: #ffd700;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .search-results-grid {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        
        .grid-video-tile {
            background: #1a1b22;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 9 / 15;
            cursor: pointer;
        }
        .grid-video-tile video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .grid-tile-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px 6px;
            background: rgba(0,0,0,0.7);
        }
        .grid-tile-user {
            font-size: 11px;
            font-weight: 700;
            color: #fff;
        }

        /* --- NOTICE BOARD POPUP --- */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: none;
            flex-direction: column;
            padding: 20px 16px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 800;
            color: #ffd700;
        }
        .close-modal-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }
        .notice-card {
            background: #181920;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #ffd700;
        }
        .notice-card h4 { font-size: 13px; color: #fff; margin-bottom: 4px; }
        .notice-card p { font-size: 11px; color: #aaa; line-height: 1.3; }
        .notice-date { font-size: 9px; color: #ffd700; margin-top: 4px; font-weight: 600; }

        /* --- ULTRA FAST HARDWARE ACCELERATED SCROLL FEED --- */
        #dynamicFeed {
            width: 100%;
            height: 100%;
            position: relative;
            overflow-y: scroll;
            scroll-snap-type: y mandatory; 
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            will-change: transform;
            transform: translateZ(0);
        }
        #dynamicFeed::-webkit-scrollbar { display: none; }

        .video-post { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            overflow: hidden;
            scroll-snap-align: start;
            scroll-snap-stop: always !important; 
            flex-shrink: 0;
            transform: translateZ(0);
        }
        
        video { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            z-index: 1;
        }

        .play-overlay-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            pointer-events: none;
            opacity: 1;
        }
        .play-overlay-btn svg { width: 28px; height: 28px; fill: #fff; margin-left: 3px; }
        .video-post.is-playing .play-overlay-btn { opacity: 0; display: none; }

        .double-tap-heart {
            position: absolute;
            z-index: 20;
            width: 70px;
            height: 70px;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            animation: heartPop 0.6s ease-out forwards;
        }
        .double-tap-heart svg { width: 100%; height: 100%; fill: #fe2c55; }

        @keyframes heartPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
        }

        /* --- SIDEBAR ACTIONS --- */
        .action-sidebar { 
            position: absolute; 
            right: 12px; 
            bottom: 65px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 16px; 
            z-index: 20; 
        }

        .profile-avatar-box {
            position: relative;
            width: 42px;
            height: 42px;
        }
        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #ffd700;
            background: #1e1e24;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #ffd700;
            font-size: 16px;
        }

        .action-btn { 
            background: none; 
            border: none; 
            color: white; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-size: 10px; 
            font-weight: 600; 
        }
        .action-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .action-icon svg { width: 20px; height: 20px; fill: #ffffff; }
        .action-btn.liked .action-icon svg { fill: #fe2c55; }
        .action-btn span { margin-top: 3px; font-size: 10px; color: #ffffff; }

        /* --- CONTENT OVERLAY --- */
        .video-info-overlay { 
            position: absolute; 
            left: 0; 
            bottom: 50px;
            width: 100%;
            padding: 20px 80px 16px 12px; 
            z-index: 15; 
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            pointer-events: none;
        }
        .user-block {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            pointer-events: auto;
        }
        .username { font-size: 14px; font-weight: 700; color: #fff; }
        .description { font-size: 12px; line-height: 1.3; color: #f1f1f1; pointer-events: auto; }

        /* --- NAVIGATION BOTTOM --- */
        .bottom-nav-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: #0d0d12;
            z-index: 100;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #8a8a9e;
            font-size: 9px;
            font-weight: 600;
            cursor: pointer;
        }
        .nav-item.active { color: #ffd700; }
        .nav-item svg { width: 20px; height: 20px; fill: currentColor; }

        .no-data { text-align: center; padding-top: 50%; color: #888; font-size: 14px; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="app-container" id="appContainer">
        
        <!-- Header -->
        <div class="header-wrapper">
            <div class="header-top-row">
                <div class="header-brand">
                    <img src="real logo copy.jpg" alt="Logo" class="header-logo-img">
                    <div class="school-title-wrap">
                        <span class="school-name">PINE HILLS</span>
                        <span class="school-tagline">Children Academy</span>
                    </div>
                </div>

                <div class="header-actions">
                    <button class="admission-btn" onclick="openAdmissionInquiry()">Admissions</button>
                    <button class="header-icon-btn" onclick="openSearchSystem()">
                        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </button>
                </div>
            </div>

            <div class="filter-pills-bar">
                <div class="pill active">All Updates</div>
                <div class="pill">Activities</div>
                <div class="pill">Announcements</div>
            </div>
        </div>

        <!-- Search Overlay -->
        <div class="search-overlay-page" id="searchOverlayPage">
            <div class="search-header-bar">
                <div class="search-input-wrapper">
                    <svg class="search-icon-inside" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchPageInput" class="search-page-input" placeholder="Search events..." onkeyup="performGridSearch()">
                </div>
                <button class="close-search-btn" onclick="closeSearchSystem()">Cancel</button>
            </div>
            <div class="search-results-grid" id="searchResultsGrid"></div>
        </div>

        <!-- Digital Notice Board Popup -->
        <div class="modal-overlay" id="noticeBoardModal">
            <div class="modal-header">
                <span class="modal-title">📢 Notice Board</span>
                <button class="close-modal-btn" onclick="closeNoticeBoard()">&times;</button>
            </div>
            <div style="flex: 1; overflow-y: auto;">
                <div class="notice-card">
                    <h4>🎓 Admissions Open</h4>
                    <p>Admissions open for Playgroup to Matric.</p>
                    <span class="notice-date">Session 2026-27</span>
                </div>
            </div>
        </div>

        <!-- Optimized Native Video Feed -->
        <div id="dynamicFeed">
            <div class="no-data">Loading Campus Feed...</div>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-nav-bar">
            <div class="nav-item active" onclick="closeNoticeBoard()">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Home</span>
            </div>
            <div class="nav-item" onclick="openAdmissionInquiry()">
                <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6l9-4.91V17h2V9L12 3z M5 13.18v4L12 21l7-3.82v-4L12 17L5 13.18z"/></svg>
                <span>Admissions</span>
            </div>
            <div class="nav-item" onclick="openNoticeBoard()">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                <span>Notices</span>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDATM3pz-eauXtxt6t3V_shp-WBhuTuovI",
            authDomain: "pine-hills-school.firebaseapp.com",
            databaseURL: "https://pine-hills-school-default-rtdb.firebaseio.com",
            projectId: "pine-hills-school",
            storageBucket: "pine-hills-school.firebasestorage.app",
            messagingSenderId: "310029732655",
            appId: "1:310029732655:web:37edd331495239524cefda"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        const feed = document.getElementById('dynamicFeed');
        
        let isUserInteracted = false;
        let localVideosData = []; 
        let feedObserver = null;
        let isDataLoaded = false;

        function initVideoObserver() {
            if (feedObserver) feedObserver.disconnect();

            const observerOptions = {
                root: feed,
                threshold: 0.5
            };

            feedObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const post = entry.target;
                    const video = post.querySelector('video');
                    if (!video) return;

                    if (entry.isIntersecting) {
                        if (isUserInteracted) {
                            video.muted = false;
                            video.play().then(() => {
                                post.classList.add('is-playing');
                            }).catch(() => {
                                video.muted = true;
                                video.play();
                                post.classList.add('is-playing');
                            });
                        }
                    } else {
                        video.pause();
                        post.classList.remove('is-playing');
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.video-post').forEach(post => {
                feedObserver.observe(post);
            });
        }

        database.ref('videos').orderByChild('timestamp').once('value', (snapshot) => {
            const data = snapshot.val();
            if (isDataLoaded) return;
            
            feed.innerHTML = '';
            localVideosData = []; 

            if(!data) {
                feed.innerHTML = '<div class="no-data">No campus videos available.</div>';
                return;
            }

            const videoEntries = Object.entries(data).reverse(); 

            videoEntries.forEach(([id, videoData], index) => {
                localVideosData.push({
                    domIndex: index,
                    username: videoData.username || '@pinehillsschool',
                    description: videoData.description || '',
                    videoUrl: videoData.videoUrl
                });

                let firstLetter = (videoData.username || 'P').replace('@','').charAt(0).toUpperCase();

                const postBlock = document.createElement('div');
                postBlock.className = 'video-post';
                postBlock.setAttribute('data-index', index);

                postBlock.innerHTML = `
                    <video loop muted playsinline preload="auto" src="${videoData.videoUrl}"></video>
                    
                    <div class="play-overlay-btn">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>

                    <div class="action-sidebar">
                        <div class="profile-avatar-box">
                            <div class="avatar-img">${firstLetter}</div>
                        </div>

                        <button class="action-btn" onclick="toggleLike(this)">
                            <div class="action-icon">
                                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            </div>
                            <span>${videoData.likes || '0'}</span>
                        </button>

                        <button class="action-btn" onclick="triggerWebsiteShare('${videoData.username}')">
                            <div class="action-icon">
                                <svg viewBox="0 0 24 24"><path d="M10 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
                            </div>
                            <span>Share</span>
                        </button>
                    </div>

                    <div class="video-info-overlay">
                        <div class="user-block">
                            <span class="username">${videoData.username || '@pinehillsschool'}</span>
                        </div>
                        <div class="description">${videoData.description || ''}</div>
                    </div>
                `;
                feed.appendChild(postBlock);
            });
            
            isDataLoaded = true;
            initVideoObserver();
        });

        /* --- ACCIDENTAL MULTI-SKIP SCROLL PREVENTER --- */
        let isWheelScrolling = false;
        feed.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (isWheelScrolling) return;

            isWheelScrolling = true;
            const direction = e.deltaY > 0 ? 1 : -1;
            const height = feed.clientHeight;

            feed.scrollBy({
                top: direction * height,
                behavior: 'smooth'
            });

            setTimeout(() => { isWheelScrolling = false; }, 400);
        }, { passive: false });

        function openAdmissionInquiry() {
            const msg = encodeURIComponent("Hello Pine Hills Children Academy! I am interested in seeking admission.");
            window.open(`https://api.whatsapp.com/send?text=${msg}`, '_blank');
        }

        function openNoticeBoard() { document.getElementById('noticeBoardModal').style.display = 'flex'; }
        function closeNoticeBoard() { document.getElementById('noticeBoardModal').style.display = 'none'; }

        function triggerWebsiteShare(username) {
            const messageText = encodeURIComponent(`Check out Pine Hills Children Academy:\n${window.location.href}`);
            window.open(`https://api.whatsapp.com/send?text=${messageText}`, '_blank');
        }

        function openSearchSystem() {
            document.querySelectorAll('video').forEach(v => v.pause());
            document.getElementById('searchOverlayPage').style.display = 'flex';
        }

        function closeSearchSystem() {
            document.getElementById('searchOverlayPage').style.display = 'none';
        }

        function performGridSearch() {
            const query = document.getElementById('searchPageInput').value.toLowerCase().trim();
            const gridContainer = document.getElementById('searchResultsGrid');
            gridContainer.innerHTML = '';
            if (query === "") return;

            const filtered = localVideosData.filter(item => item.username.toLowerCase().includes(query) || item.description.toLowerCase().includes(query));

            filtered.forEach(item => {
                const tile = document.createElement('div');
                tile.className = 'grid-video-tile';
                tile.onclick = () => scrollToSelectedVideo(item.domIndex);
                tile.innerHTML = `<video src="${item.videoUrl}" muted playsinline preload="none"></video><div class="grid-tile-overlay"><div class="grid-tile-user">${item.username}</div></div>`;
                gridContainer.appendChild(tile);
            });
        }

        function scrollToSelectedVideo(targetIndex) {
            document.getElementById('searchOverlayPage').style.display = 'none';
            const posts = document.querySelectorAll('.video-post');
            if (posts[targetIndex]) {
                isUserInteracted = true;
                posts[targetIndex].scrollIntoView({ behavior: 'auto' });
            }
        }

        function toggleLike(btn) { btn.classList.toggle('liked'); }

        feed.addEventListener('click', (e) => {
            if (e.target.closest('.action-sidebar') || e.target.closest('.header-wrapper') || e.target.closest('.bottom-nav-bar')) return;
            
            const currentPost = e.target.closest('.video-post');
            if (!currentPost) return;

            const video = currentPost.querySelector('video');
            if (video) {
                isUserInteracted = true;
                video.muted = false;
                if (video.paused) {
                    video.play();
                    currentPost.classList.add('is-playing');
                } else {
                    video.pause();
                    currentPost.classList.remove('is-playing');
                }
            }
        });
    </script>
</body>
</html>
